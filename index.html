<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221E1B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ぼかしマスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E9E4DD; --panel:#F6F3EF; --raise:#FFFFFF; --ink:#211D1A; --muted:#6E655D; --line:#D5CCC2;
  --stage:#2B2622; --accent:#B8650F; --accent-ink:#FFFFFF; --accent-soft:#F3DFC6; --danger:#B3362B; --sub:#2F6FB5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1A1715; --panel:#221E1B; --raise:#2C2724; --ink:#EFE8E0; --muted:#A2988E; --line:#3A3430;
    --stage:#0E0C0B; --accent:#F0A63A; --accent-ink:#241605; --accent-soft:#4A3417; --danger:#F07468; --sub:#7EB4F2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A1715; --panel:#221E1B; --raise:#2C2724; --ink:#EFE8E0; --muted:#A2988E; --line:#3A3430;
  --stage:#0E0C0B; --accent:#F0A63A; --accent-ink:#241605; --accent-soft:#4A3417; --danger:#F07468; --sub:#7EB4F2;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.bar{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.ib{min-width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;padding:0 8px}
.ib:active{background:var(--accent-soft)}
.ib:disabled{opacity:.35}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--raise);padding:0 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn:disabled{opacity:.4}
.btn.small{height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--danger)}

#main{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:200px;position:relative;background:var(--stage);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:absolute;display:none}
#ui{position:absolute;inset:0;width:100%;height:100%}
#vid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#E8DFD4}
#empty .frame{border:1.5px dashed rgba(240,166,58,.6);border-radius:22px;padding:30px 22px;max-width:340px}
#empty h2{font-size:20px;margin:0 0 6px}
#empty p{margin:0 0 18px;color:#B9AEA3;font-size:14px}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,16,13,.82);color:#F5EDE3;padding:7px 14px;border-radius:18px;font-size:13px;pointer-events:none;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}

/* dock */
#dock{display:flex;flex-direction:column;overflow:hidden;flex:0 0 47%;min-height:0;user-select:none;-webkit-user-select:none;background:var(--panel);border-top:1px solid var(--line);overscroll-behavior:contain}
.transport{display:flex;align-items:center;gap:2px;padding:4px 6px 0}
.transport .time{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.transport .ib{min-width:40px}
.transport .time b{color:var(--ink);font-weight:700;font-size:14px}
@media (max-width:520px){ .bar h1 small{display:none} .transport .time .dur{display:none} }
.ib.on{color:var(--accent)}
.kf{display:flex;align-items:center}
.kf .ib{min-width:38px}
#keyBtn svg{width:20px;height:20px}
#keyBtn.has svg{fill:var(--accent);stroke:var(--accent)}

.dock-top{flex:0 0 auto;border-bottom:1px solid var(--line)}
.dock-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:8px}
.tlwrap{position:relative;padding-bottom:6px}
#tlc{display:block;width:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:8px;top:2px;display:flex;gap:4px}
.zoom button{width:30px;height:22px;border-radius:7px;border:1px solid var(--line);background:var(--raise);font-size:15px;line-height:1;padding:0;cursor:pointer}
.chip.sub{border-style:dashed;border-color:var(--sub);color:var(--ink);margin-left:-2px}
.chip.sub.sel{border-style:solid;box-shadow:inset 0 0 0 1px var(--sub);border-color:var(--sub)}
.chip.sub svg{stroke:var(--sub)}
.subadd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 8px}
.btn.sub{display:inline-flex;align-items:center;gap:6px;border-color:var(--sub);color:var(--sub);font-weight:700}
.btn.sub svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
select{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:inherit;padding:0 10px}
.track{position:relative;height:34px;border-radius:8px;background:var(--raise);border:1px solid var(--line);cursor:pointer}
.track .range{position:absolute;top:4px;bottom:4px;background:var(--accent-soft);border-radius:5px;display:none}
.track .head{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);margin-left:-1px;pointer-events:none}
.track .head::before{content:"";position:absolute;top:-3px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.track .key{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:var(--accent);border:2px solid var(--raise);border-radius:2px}
.track .key::after{content:"";position:absolute;inset:-10px}

.masks{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.masks::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:14px}
.chip.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.off .nm{opacity:.45;text-decoration:line-through}
.chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip .eye{width:30px;height:30px;border:0;background:transparent;display:grid;place-items:center;border-radius:8px;color:var(--muted);padding:0}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700;padding:0 14px}

.props{padding:2px 16px 18px;display:none}
.props.show{display:block}
.row{display:flex;align-items:center;gap:10px;min-height:44px}
.row>label,.row>.lab{width:84px;flex:0 0 84px;font-size:13px;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.row .val{width:34px;text-align:right;font-size:13px}
.seg{display:flex;flex:1;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border:0;background:transparent;border-radius:9px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.switch{position:relative;width:48px;height:28px;flex:0 0 48px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--raise);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.span-times{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.span-times .t{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.span-times .t b{color:var(--ink);font-size:14px;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:20;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease-out;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 12px;font-size:17px}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shape{border:1px solid var(--line);background:var(--raise);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.shape svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.8}
.shape b{font-size:15px}
.shape span{font-size:12px;color:var(--muted);line-height:1.4}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.opt div{display:flex;flex-direction:column}
.opt small{color:var(--muted);font-size:12px}
.lbl{font-size:13px;color:var(--muted);margin:8px 0 6px}
.prog{height:10px;border-radius:5px;background:var(--raise);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.stat{font-size:13px;color:var(--muted);min-height:20px}
.err{color:var(--danger);font-size:14px;margin:8px 0}

@media (orientation:landscape) and (min-width:700px){
  .transport .time .dur{display:none}
  #main{flex-direction:row}
  #dock{height:auto;width:380px;flex:0 0 380px;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){ .sheet,.switch span,.switch span::after,#toast,.prog i{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <h1>ぼかしマスク<small id="meta"></small></h1>
    <button class="ib" id="openBtn" aria-label="動画を開く" title="動画を開く"><svg viewBox="0 0 24 24"><path d="M4 7h5l2 2h9v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 12v5M9.5 14.5 12 12l2.5 2.5"/></svg></button>
    <button class="ib" id="undoBtn" aria-label="取り消す" title="取り消す" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redoBtn" aria-label="やり直す" title="やり直す" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn primary" id="exportBtn" disabled>書き出し</button>
  </header>
  <div id="main">
    <div id="stage">
      <video id="vid" playsinline preload="auto"></video>
      <canvas id="view"></canvas>
      <canvas id="ui"></canvas>
      <div id="empty"><div class="frame">
        <h2>ぼかしたい動画を選ぶ</h2>
        <p>映り込んだ人や看板に、四角・円形・線形のマスクで部分的にぼかしをかけます。MP4 / MOV、縦横どちらも、4K まで。</p>
        <button class="btn primary" id="openBtn2">動画を選ぶ</button>
      </div></div>
      <div id="hint"></div>
    </div>
    <div id="dock">
      <div class="dock-top">
      <div class="transport">
        <button class="ib" id="prevF" aria-label="1フレーム戻る"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6l-8 6 8 6z"/></svg></button>
        <button class="ib" id="playBtn" aria-label="再生"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="ib" id="nextF" aria-label="1フレーム進む"><svg viewBox="0 0 24 24"><path d="M18 6v12M6 6l8 6-8 6z"/></svg></button>
        <div class="time"><b id="tNow">00:00.00</b><span class="dur"> / <span id="tDur">00:00.00</span></span></div>
        <div class="kf">
          <button class="ib" id="keyPrev" aria-label="前のキーフレーム"><svg viewBox="0 0 24 24"><path d="m10 6-6 6 6 6"/><path d="m16 8 4 4-4 4-4-4z"/></svg></button>
          <button class="ib" id="keyBtn" aria-label="キーフレームを追加・削除"><svg viewBox="0 0 24 24"><path d="m12 4 8 8-8 8-8-8z"/></svg></button>
          <button class="ib" id="keyNext" aria-label="次のキーフレーム"><svg viewBox="0 0 24 24"><path d="m14 6 6 6-6 6"/><path d="m8 8 4 4-4 4-4-4z"/></svg></button>
        </div>
        <button class="ib" id="ovBtn" aria-label="マスク範囲を赤で表示" title="マスク範囲を赤で表示"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
      </div>
      <div class="tlwrap" id="tlwrap"><canvas id="tlc"></canvas>
        <div class="zoom"><button id="zOut" aria-label="縮小">−</button><button id="zIn" aria-label="拡大">＋</button></div>
      </div>
      </div>
      <div class="dock-scroll">
      <div class="masks" id="maskList"></div>
      <div class="props" id="props">
        <div class="subadd" id="subAddRow"><button class="btn small sub" id="subBtn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5 8h6"/></svg>除算マスクで削る</button><span class="note">ぼかしたくない部分を、このマスクから取り除きます</span></div>
        <div class="row"><span class="lab">形状</span>
          <div class="seg" id="shapeSeg">
            <button data-t="rect"><svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1"/></svg>四角</button>
            <button data-t="ellipse"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="4.6"/></svg>円形</button>
            <button data-t="linear"><svg viewBox="0 0 16 16"><path d="M1 4h14M1 8h14M1 12h14"/></svg>線形</button>
            <button data-t="full"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="1"/><path d="M1.5 9.5 9.5 1.5M5 14.5l9.5-9.5"/></svg>全体</button>
          </div></div>
        <div class="row" id="targetRow"><label for="targetSel">削る対象</label><select id="targetSel"></select></div>
        <div class="row" id="blurRow"><label for="blurR">ぼかし強度</label><input type="range" id="blurR" min="1" max="100"><span class="val" id="blurV"></span></div>
        <div class="row" id="featherRow"><label for="featherR">境界ぼかし</label><input type="range" id="featherR" min="0" max="100"><span class="val" id="featherV"></span></div>
        <div class="row" id="invRow"><span class="lab">反転</span><label class="switch"><input type="checkbox" id="invChk" aria-label="マスクを反転"><span></span></label><span class="note">外側をぼかす</span></div>
        <div class="row"><span class="lab">動きを記録</span><label class="switch"><input type="checkbox" id="animChk" aria-label="キーフレームで動かす"><span></span></label><span class="note" id="animNote">オンにすると、動かした時点ごとにキーフレームを打ちます</span></div>
        <div class="row" style="align-items:flex-start;padding-top:8px"><span class="lab">表示区間</span>
          <div class="span-times">
            <div class="t">開始<b id="spanS">00:00.00</b><button class="btn small" id="setS">今の位置にする</button></div>
            <div class="t">終了<b id="spanE">00:00.00</b><button class="btn small" id="setE">今の位置にする</button></div>
          </div></div>
        <div class="actions">
          <button class="btn small" id="spanAll">全区間にする</button>
          <button class="btn small" id="centerBtn">中央に戻す</button>
          <button class="btn small" id="dupBtn">複製</button>
          <button class="btn small danger" id="delBtn">削除</button>
        </div>
      </div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="addSheet" role="dialog" aria-label="マスクを追加">
  <div class="grab"></div>
  <h3 id="addTitle">マスクを追加</h3>
  <div class="shapes">
    <button class="shape" data-t="rect"><svg viewBox="0 0 34 34"><rect x="5" y="8" width="24" height="18" rx="2"/><rect x="9" y="12" width="16" height="10" rx="1" stroke-dasharray="2 2"/></svg><b>四角</b><span>画面をドラッグして範囲を描きます</span></button>
    <button class="shape" data-t="ellipse"><svg viewBox="0 0 34 34"><ellipse cx="17" cy="17" rx="13" ry="10"/><ellipse cx="17" cy="17" rx="8" ry="6" stroke-dasharray="2 2"/></svg><b>円形</b><span>顔のぼかしに。ドラッグで楕円を描きます</span></button>
    <button class="shape" data-t="linear"><svg viewBox="0 0 34 34"><path d="M3 10h28M3 17h28M3 24h28" /><path d="M3 10h28" stroke-width="3"/></svg><b>線形</b><span>画面の片側を段階的にぼかします</span></button>
    <button class="shape" data-t="full"><svg viewBox="0 0 34 34"><rect x="4" y="6" width="26" height="22" rx="2"/><path d="M4 18 16 6M10 28 30 8M22 28l8-8"/></svg><b>全体</b><span>画面全体。反転した他のマスクと組み合わせても</span></button>
  </div>
  <div class="actions" style="justify-content:flex-end"><button class="btn" id="addCancel">閉じる</button></div>
</div>

<div class="sheet" id="expSheet" role="dialog" aria-label="書き出し">
  <div class="grab"></div>
  <h3>書き出し（H.264 / MP4）</h3>
  <div id="expForm">
    <div class="lbl">解像度</div>
    <div class="opts" id="resOpts"></div>
    <div class="lbl">画質</div>
    <div class="opts" id="qOpts"></div>
    <p class="note" id="audioNote"></p>
    <div class="actions" style="justify-content:flex-end"><button class="btn" id="expClose">閉じる</button><button class="btn primary" id="expStart">書き出す</button></div>
  </div>
  <div id="expRun" style="display:none">
    <div class="prog"><i id="progBar"></i></div>
    <div class="stat" id="progStat">準備中…</div>
    <p class="note">書き出しが終わるまで、この画面を開いたままにしてください。</p>
    <div class="err" id="expErr"></div>
    <div class="actions" style="justify-content:flex-end" id="runActs">
      <button class="btn" id="expCancel">中止</button>
    </div>
    <div class="actions" style="justify-content:flex-end;display:none" id="doneActs">
      <button class="btn" id="expBack">閉じる</button>
      <button class="btn" id="shareBtn" style="display:none">共有</button>
      <button class="btn primary" id="saveBtn">保存する</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="video/mp4,video/quicktime,video/*" hidden>
<script>
// ===== MP4 読み込み（moov 解析）と書き出し（mux） =====
const str4 = (u, o) => String.fromCharCode(u[o], u[o + 1], u[o + 2], u[o + 3]);

async function readBytes(file, start, end) {
  return new Uint8Array(await file.slice(start, end).arrayBuffer());
}

function* boxes(u8, start, end) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let o = start;
  while (o + 8 <= end) {
    let size = dv.getUint32(o);
    const type = str4(u8, o + 4);
    let hdr = 8;
    if (size === 1) { size = Number(dv.getBigUint64(o + 8)); hdr = 16; }
    else if (size === 0) size = end - o;
    if (size < hdr || o + size > end) break;
    yield { type, start: o, hdrEnd: o + hdr, end: o + size };
    o += size;
  }
}
function child(u8, box, type) {
  for (const b of boxes(u8, box.hdrEnd, box.end)) if (b.type === type) return b;
  return null;
}
function findPath(u8, box, ...types) {
  let b = box;
  for (const t of types) { b = child(u8, b, t); if (!b) return null; }
  return b;
}
function findDeep(u8, start, end, type, depth = 0) {
  if (depth > 4) return null;
  for (const b of boxes(u8, start, end)) {
    if (b.type === type) return b;
    if (b.type === 'wave') { const r = findDeep(u8, b.hdrEnd, b.end, type, depth + 1); if (r) return r; }
  }
  return null;
}

async function parseMP4(file) {
  const size = file.size;
  let off = 0, moov = null;
  while (off + 8 <= size) {
    const h = await readBytes(file, off, Math.min(off + 16, size));
    const dv = new DataView(h.buffer);
    let bsize = dv.getUint32(0);
    const type = str4(h, 4);
    let hdr = 8;
    if (bsize === 1) { bsize = Number(dv.getBigUint64(8)); hdr = 16; }
    else if (bsize === 0) bsize = size - off;
    if (bsize < hdr) throw new Error('MP4 の構造を読み取れませんでした。');
    if (type === 'moov') { moov = await readBytes(file, off, off + bsize); break; }
    off += bsize;
  }
  if (!moov) throw new Error('MP4/MOV 形式の動画を選んでください（moov が見つかりません）。');
  return parseMoov(moov);
}

function parseMoov(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const root = boxes(u8, 0, u8.length).next().value;
  const tracks = [];
  for (const trak of boxes(u8, root.hdrEnd, root.end)) {
    if (trak.type !== 'trak') continue;
    try { const t = parseTrak(u8, dv, trak); if (t) tracks.push(t); } catch (e) { console.warn('trak skip', e); }
  }
  const video = tracks.find(t => t.kind === 'video');
  const audio = tracks.find(t => t.kind === 'audio') || null;
  if (!video) throw new Error('映像トラックが見つかりません。');
  return { video, audio };
}

function parseTrak(u8, dv, trak) {
  const hdlr = findPath(u8, trak, 'mdia', 'hdlr');
  const handler = hdlr ? str4(u8, hdlr.hdrEnd + 8) : '';
  const kind = handler === 'vide' ? 'video' : handler === 'soun' ? 'audio' : null;
  if (!kind) return null;

  // tkhd: 回転行列
  const tkhd = child(u8, trak, 'tkhd');
  let rotation = 0, trackId = 0;
  if (tkhd) {
    const v = u8[tkhd.hdrEnd];
    let p = tkhd.hdrEnd + 4;
    trackId = dv.getUint32(p + (v === 1 ? 16 : 8));
    p += v === 1 ? 32 : 20;
    p += 16; // reserved(8) layer alt volume reserved
    const a = dv.getInt32(p) / 65536, b = dv.getInt32(p + 4) / 65536;
    let deg = Math.round(Math.atan2(b, a) * 180 / Math.PI);
    deg = ((Math.round(deg / 90) * 90) % 360 + 360) % 360;
    rotation = deg;
  }
  // mdhd
  const mdhd = findPath(u8, trak, 'mdia', 'mdhd');
  const mv = u8[mdhd.hdrEnd];
  const timescale = dv.getUint32(mdhd.hdrEnd + (mv === 1 ? 20 : 12));
  // elst
  let mediaTime = 0;
  const elst = findPath(u8, trak, 'edts', 'elst');
  if (elst) {
    const ev = u8[elst.hdrEnd];
    const cnt = dv.getUint32(elst.hdrEnd + 4);
    let p = elst.hdrEnd + 8;
    for (let i = 0; i < cnt; i++) {
      const mt = ev === 1 ? Number(dv.getBigInt64(p + 8)) : dv.getInt32(p + 4);
      p += ev === 1 ? 20 : 12;
      if (mt >= 0) { mediaTime = mt; break; }
    }
  }
  const stbl = findPath(u8, trak, 'mdia', 'minf', 'stbl');
  if (!stbl) return null;
  const stsd = child(u8, stbl, 'stsd');
  const entry = boxes(u8, stsd.hdrEnd + 8, stsd.end).next().value;
  const t = { kind, trackId, timescale, mediaTime, rotation, format: entry.type };

  if (kind === 'video') {
    t.width = dv.getUint16(entry.start + 32);
    t.height = dv.getUint16(entry.start + 34);
    const avcC = findDeep(u8, entry.start + 86, entry.end, 'avcC');
    const hvcC = findDeep(u8, entry.start + 86, entry.end, 'hvcC');
    if (avcC) {
      const d = u8.slice(avcC.hdrEnd, avcC.end);
      t.description = d;
      t.codec = 'avc1.' + [d[1], d[2], d[3]].map(x => x.toString(16).padStart(2, '0')).join('');
    } else if (hvcC) {
      const d = u8.slice(hvcC.hdrEnd, hvcC.end);
      t.description = d;
      t.codec = hevcCodecString(entry.type === 'hev1' ? 'hev1' : 'hvc1', d);
    } else {
      const vpcC = findDeep(u8, entry.start + 86, entry.end, 'vpcC');
      const av1C = findDeep(u8, entry.start + 86, entry.end, 'av1C');
      const p2 = x => String(x).padStart(2, '0');
      if (vpcC) { const q = vpcC.hdrEnd + 4; t.codec = `vp09.${p2(u8[q])}.${p2(u8[q + 1])}.${p2(u8[q + 2] >> 4)}`; }
      else if (av1C) { const q = av1C.hdrEnd; const prof = u8[q + 1] >> 5, lvl = u8[q + 1] & 31, tier = u8[q + 2] >> 7, hb = (u8[q + 2] >> 6) & 1, tw = (u8[q + 2] >> 5) & 1; t.codec = `av01.${prof}.${p2(lvl)}${tier ? 'H' : 'M'}.${hb ? (tw ? '12' : '10') : '08'}`; }
      else t.codec = null;
    }
  } else {
    const sv = dv.getUint16(entry.start + 16);
    t.channels = dv.getUint16(entry.start + 24);
    t.sampleRate = dv.getUint32(entry.start + 32) >>> 16;
    t.entryBytes = u8.slice(entry.start, entry.end); // 音声はそのまま流用
    const cstart = entry.start + 36 + (sv === 1 ? 16 : sv === 2 ? 36 : 0);
    const esds = findDeep(u8, cstart, entry.end, 'esds');
    t.codec = entry.type === 'mp4a' ? 'mp4a' : entry.type;
    if (esds) { const asc = parseEsds(u8.subarray(esds.hdrEnd + 4, esds.end)); if (asc) t.codec = 'mp4a.40.' + (asc[0] >> 3); }
  }

  // サンプルテーブル
  const stsz = child(u8, stbl, 'stsz'), stz2 = child(u8, stbl, 'stz2');
  let n, sizes;
  if (stsz) {
    const fixed = dv.getUint32(stsz.hdrEnd + 4);
    n = dv.getUint32(stsz.hdrEnd + 8);
    sizes = new Uint32Array(n);
    if (fixed) sizes.fill(fixed);
    else for (let i = 0; i < n; i++) sizes[i] = dv.getUint32(stsz.hdrEnd + 12 + i * 4);
  } else if (stz2) {
    const fs = u8[stz2.hdrEnd + 7];
    n = dv.getUint32(stz2.hdrEnd + 8);
    sizes = new Uint32Array(n);
    const p = stz2.hdrEnd + 12;
    for (let i = 0; i < n; i++) {
      if (fs === 16) sizes[i] = dv.getUint16(p + i * 2);
      else if (fs === 8) sizes[i] = u8[p + i];
      else sizes[i] = (u8[p + (i >> 1)] >> ((i & 1) ? 0 : 4)) & 15;
    }
  } else throw new Error('stsz なし');
  t.n = n; t.sizes = sizes;

  const stco = child(u8, stbl, 'stco'), co64 = child(u8, stbl, 'co64');
  let chunks;
  if (stco) {
    const c = dv.getUint32(stco.hdrEnd + 4); chunks = new Float64Array(c);
    for (let i = 0; i < c; i++) chunks[i] = dv.getUint32(stco.hdrEnd + 8 + i * 4);
  } else {
    const c = dv.getUint32(co64.hdrEnd + 4); chunks = new Float64Array(c);
    for (let i = 0; i < c; i++) chunks[i] = Number(dv.getBigUint64(co64.hdrEnd + 8 + i * 8));
  }
  const stsc = child(u8, stbl, 'stsc');
  const sc = dv.getUint32(stsc.hdrEnd + 4);
  const ents = [];
  for (let i = 0; i < sc; i++) { const p = stsc.hdrEnd + 8 + i * 12; ents.push([dv.getUint32(p), dv.getUint32(p + 4)]); }
  const offsets = new Float64Array(n);
  let si = 0;
  for (let e = 0; e < ents.length && si < n; e++) {
    const first = ents[e][0] - 1, last = e + 1 < ents.length ? ents[e + 1][0] - 1 : chunks.length;
    for (let c = first; c < last && si < n; c++) {
      let o = chunks[c];
      for (let k = 0; k < ents[e][1] && si < n; k++) { offsets[si] = o; o += sizes[si]; si++; }
    }
  }
  t.offsets = offsets;

  const stts = child(u8, stbl, 'stts');
  const dts = new Float64Array(n), durs = new Uint32Array(n);
  {
    const c = dv.getUint32(stts.hdrEnd + 4); let i = 0, acc = 0;
    for (let e = 0; e < c; e++) {
      const cnt = dv.getUint32(stts.hdrEnd + 8 + e * 8), d = dv.getUint32(stts.hdrEnd + 12 + e * 8);
      for (let k = 0; k < cnt && i < n; k++) { dts[i] = acc; durs[i] = d; acc += d; i++; }
    }
    for (; i < n; i++) { dts[i] = acc; durs[i] = durs[i - 1] || 1; acc += durs[i]; }
  }
  const cts = Float64Array.from(dts);
  const ctts = child(u8, stbl, 'ctts');
  if (ctts) {
    const c = dv.getUint32(ctts.hdrEnd + 4); let i = 0;
    for (let e = 0; e < c; e++) {
      const cnt = dv.getUint32(ctts.hdrEnd + 8 + e * 8), off = dv.getInt32(ctts.hdrEnd + 12 + e * 8);
      for (let k = 0; k < cnt && i < n; k++) { cts[i] += off; i++; }
    }
  }
  const sync = new Uint8Array(n);
  const stss = child(u8, stbl, 'stss');
  if (stss) {
    const c = dv.getUint32(stss.hdrEnd + 4);
    for (let i = 0; i < c; i++) { const k = dv.getUint32(stss.hdrEnd + 8 + i * 4) - 1; if (k < n) sync[k] = 1; }
  } else sync.fill(1);
  t.dts = dts; t.cts = cts; t.durs = durs; t.sync = sync;
  // 表示時刻（秒）
  t.pts = new Float64Array(n);
  for (let i = 0; i < n; i++) t.pts[i] = (cts[i] - mediaTime) / timescale;
  let minP = Infinity, maxP = -Infinity, bytes = 0;
  for (let i = 0; i < n; i++) { if (t.pts[i] < minP) minP = t.pts[i]; if (t.pts[i] > maxP) maxP = t.pts[i]; bytes += sizes[i]; }
  t.start = minP;
  t.duration = n ? (maxP - minP) + (durs[n - 1] / timescale) : 0;
  t.bytes = bytes;
  if (kind === 'video') {
    t.fps = n > 1 ? n / t.duration : 30;
    // 表示順インデックス
    const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => t.pts[a] - t.pts[b]);
    t.order = Uint32Array.from(order);
    t.syncList = [];
    for (let i = 0; i < n; i++) if (sync[i]) t.syncList.push(i);
    const rot = rotation % 180 !== 0;
    t.dispW = rot ? t.height : t.width;
    t.dispH = rot ? t.width : t.height;
  }
  return t;
}

function parseEsds(u8) {
  let p = 0;
  const readLen = () => { let len = 0; for (let i = 0; i < 4; i++) { const b = u8[p++]; len = (len << 7) | (b & 0x7f); if (!(b & 0x80)) break; } return len; };
  while (p < u8.length) {
    const tag = u8[p++]; const len = readLen(); const end = p + len;
    if (tag === 0x03) {
      p += 2; const f = u8[p++];
      if (f & 0x80) p += 2;
      if (f & 0x40) p += 1 + u8[p];
      if (f & 0x20) p += 2;
      continue; // 内側の記述子へ
    }
    if (tag === 0x04) { p += 13; continue; }
    if (tag === 0x05) return u8.slice(p, end);
    p = end;
  }
  return null;
}

function hevcCodecString(prefix, d) {
  const space = d[1] >> 6, tier = (d[1] >> 5) & 1, profile = d[1] & 31;
  let compat = ((d[2] << 24) | (d[3] << 16) | (d[4] << 8) | d[5]) >>> 0;
  let rev = 0;
  for (let i = 0; i < 32; i++) { rev = (rev << 1) | (compat & 1); compat >>>= 1; }
  rev >>>= 0;
  const level = d[12];
  const cons = [d[6], d[7], d[8], d[9], d[10], d[11]];
  while (cons.length && cons[cons.length - 1] === 0) cons.pop();
  let s = `${prefix}.${['', 'A', 'B', 'C'][space]}${profile}.${rev.toString(16).toUpperCase()}.${tier ? 'H' : 'L'}${level}`;
  for (const c of cons) s += '.' + c.toString(16).toUpperCase();
  return s;
}

// ===== 書き出し（faststart MP4） =====
class BW {
  constructor(n = 4096) { this.b = new Uint8Array(n); this.p = 0; }
  ensure(k) { if (this.p + k > this.b.length) { const nb = new Uint8Array(Math.max(this.b.length * 2, this.p + k + 1024)); nb.set(this.b.subarray(0, this.p)); this.b = nb; } }
  u8(v) { this.ensure(1); this.b[this.p++] = v & 255; }
  u16(v) { this.u8(v >> 8); this.u8(v); }
  u32(v) { v = v >>> 0; this.ensure(4); this.b[this.p++] = v >>> 24; this.b[this.p++] = (v >>> 16) & 255; this.b[this.p++] = (v >>> 8) & 255; this.b[this.p++] = v & 255; }
  i32(v) { this.u32(v | 0); }
  u64(v) { this.u32(Math.floor(v / 4294967296)); this.u32(v % 4294967296); }
  bytes(a) { this.ensure(a.length); this.b.set(a, this.p); this.p += a.length; }
  str(s) { for (let i = 0; i < s.length; i++) this.u8(s.charCodeAt(i)); }
  zeros(n) { this.ensure(n); for (let i = 0; i < n; i++) this.b[this.p++] = 0; }
  box(type, fn) {
    const s = this.p; this.u32(0); this.str(type); fn();
    const size = this.p - s; const q = this.p; this.p = s; this.u32(size); this.p = q;
  }
  full(type, ver, flags, fn) { this.box(type, () => { this.u8(ver); this.u8(flags >> 16); this.u8(flags >> 8); this.u8(flags); fn(); }); }
  out() { return this.b.slice(0, this.p); }
}

class Mp4Builder {
  constructor() {
    this.parts = []; this.group = []; this.groupBytes = 0; this.pos = 0;
    this.v = { sizes: [], offs: [], ptsUs: [], key: [] };
    this.a = { sizes: [], offs: [], durs: [] };
  }
  _push(part, size) {
    this.group.push(part); this.groupBytes += size; this.pos += size;
    if (this.group.length > 2000 || this.groupBytes > (24 << 20)) this._flush();
  }
  _flush() { if (this.group.length) { this.parts.push(new Blob(this.group)); this.group = []; this.groupBytes = 0; } }
  addVideo(data, ptsUs, isKey) {
    this.v.offs.push(this.pos); this.v.sizes.push(data.length); this.v.ptsUs.push(ptsUs); this.v.key.push(isKey ? 1 : 0);
    this._push(data, data.length);
  }
  addAudio(blobOrBytes, size, dur) {
    this.a.offs.push(this.pos); this.a.sizes.push(size); this.a.durs.push(dur);
    this._push(blobOrBytes, size);
  }
  // vi: {width,height,avcC,timescale,lastDurUs}  ai: {timescale, entryBytes, mediaTime} | null
  finalize(vi, ai) {
    this._flush();
    const ts = vi.timescale;
    const n = this.v.sizes.length;
    if (!n) throw new Error('映像フレームがありません');
    const ticks = this.v.ptsUs.map(u => Math.round(u * ts / 1e6));
    const first = Math.min(...ticks);
    // dts: 昇順に並べた pts。並べ替え不要なら ctts なし
    const sorted = ticks.slice().sort((a, b) => a - b);
    let shift = 0;
    for (let i = 0; i < n; i++) shift = Math.max(shift, sorted[i] - ticks[i]);
    const dts = sorted.map(x => x - first - shift);
    const ctso = ticks.map((x, i) => (x - first) - dts[i]);
    const hasCtts = ctso.some(x => x !== 0);
    const lastDur = Math.max(1, Math.round(vi.lastDurUs * ts / 1e6));
    const vdurs = dts.map((d, i) => i + 1 < n ? Math.max(1, dts[i + 1] - d) : lastDur);
    const vTotal = vdurs.reduce((s, x) => s + x, 0);
    const movTs = 1000;
    const vEdits = [];
    const firstSec = first / ts;
    if (firstSec > 0.0005) vEdits.push({ dur: Math.round(firstSec * movTs), mt: -1 });
    if (shift || vEdits.length) vEdits.push({ dur: Math.round(vTotal / ts * movTs), mt: shift });

    const aTs = ai ? ai.timescale : 1;
    const aTotal = ai ? this.a.durs.reduce((s, x) => s + x, 0) : 0;
    const aEdits = (ai && ai.mediaTime > 0) ? [{ dur: Math.round((aTotal - ai.mediaTime) / aTs * movTs), mt: ai.mediaTime }] : [];
    const vMovDur = Math.round((firstSec + vTotal / ts) * movTs);
    const aMovDur = ai ? Math.round(aTotal / aTs * movTs) : 0;

    const build = (base) => {
      const w = new BW(1 << 16);
      w.box('moov', () => {
        w.full('mvhd', 0, 0, () => {
          w.u32(0); w.u32(0); w.u32(movTs); w.u32(Math.max(vMovDur, aMovDur));
          w.u32(0x00010000); w.u16(0x0100); w.zeros(10);
          matrix(w); w.zeros(24); w.u32(ai && this.a.sizes.length ? 3 : 2);
        });
        trak(w, {
          id: 1, kind: 'vide', ts, movDur: vMovDur, total: vTotal, width: vi.width, height: vi.height, edits: vEdits,
          stsd: () => w.box('avc1', () => {
            w.zeros(6); w.u16(1); w.zeros(16); w.u16(vi.width); w.u16(vi.height);
            w.u32(0x00480000); w.u32(0x00480000); w.u32(0); w.u16(1); w.zeros(32); w.u16(0x18); w.u16(0xffff);
            w.box('avcC', () => w.bytes(vi.avcC));
          }),
          durs: vdurs, ctts: hasCtts ? ctso : null, sizes: this.v.sizes, offs: this.v.offs, base,
          sync: this.v.key.every(k => k) ? null : this.v.key,
        });
        if (ai && this.a.sizes.length) trak(w, {
          id: 2, kind: 'soun', ts: aTs, movDur: aMovDur, total: aTotal, edits: aEdits,
          stsd: () => w.bytes(ai.entryBytes),
          durs: this.a.durs, ctts: null, sizes: this.a.sizes, offs: this.a.offs, base, sync: null,
        });
      });
      return w.out();
    };
    const ftypW = new BW(64);
    ftypW.box('ftyp', () => { ftypW.str('isom'); ftypW.u32(512); ftypW.str('isomiso2avc1mp41'); });
    const ftyp = ftypW.out();
    const moovLen = build(0).length;
    const mdatPayload = this.pos;
    const base = ftyp.length + moovLen + 16;
    const moov = build(base);
    const mh = new BW(16); mh.u32(1); mh.str('mdat'); mh.u64(mdatPayload + 16);
    return new Blob([ftyp, moov, mh.out(), ...this.parts], { type: 'video/mp4' });
  }
}

function matrix(w) { [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000].forEach(x => w.u32(x)); }

function trak(w, o) {
  w.box('trak', () => {
    w.full('tkhd', 0, 3, () => {
      w.u32(0); w.u32(0); w.u32(o.id); w.u32(0); w.u32(o.movDur);
      w.zeros(8); w.u16(0); w.u16(o.kind === 'soun' ? 1 : 0); w.u16(o.kind === 'soun' ? 0x0100 : 0); w.u16(0);
      matrix(w);
      w.u32((o.width || 0) * 65536); w.u32((o.height || 0) * 65536);
    });
    if (o.edits.length) w.box('edts', () => w.full('elst', 0, 0, () => {
      w.u32(o.edits.length);
      for (const e of o.edits) { w.u32(e.dur); w.i32(e.mt); w.u32(0x00010000); }
    }));
    w.box('mdia', () => {
      w.full('mdhd', 0, 0, () => { w.u32(0); w.u32(0); w.u32(o.ts); w.u32(Math.min(o.total, 0xffffffff)); w.u16(0x55c4); w.u16(0); });
      w.full('hdlr', 0, 0, () => { w.u32(0); w.str(o.kind); w.zeros(12); w.str(o.kind === 'vide' ? 'VideoHandler' : 'SoundHandler'); w.u8(0); });
      w.box('minf', () => {
        if (o.kind === 'vide') w.full('vmhd', 0, 1, () => w.zeros(8));
        else w.full('smhd', 0, 0, () => w.zeros(4));
        w.box('dinf', () => w.full('dref', 0, 0, () => { w.u32(1); w.full('url ', 0, 1, () => {}); }));
        w.box('stbl', () => {
          w.full('stsd', 0, 0, () => { w.u32(1); o.stsd(); });
          // stts
          const runs = [];

// ===== WebGL2 レンダラー：ガウスぼかし＋マスク合成 =====
const GL_VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

const GL_COPY = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uTex; out vec4 o;
void main(){ o = texture(uTex, vUv); }`;

const GL_ORIENT = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uTex; uniform int uRot; out vec4 o;
void main(){
  vec2 d = vec2(vUv.x, 1.0-vUv.y); vec2 s;
  if (uRot==90) s = vec2(d.y, 1.0-d.x);
  else if (uRot==180) s = vec2(1.0-d.x, 1.0-d.y);
  else if (uRot==270) s = vec2(1.0-d.y, d.x);
  else s = d;
  o = texture(uTex, vec2(s.x, 1.0-s.y));
}`;

const GL_GAUSS = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir; uniform float uSigma; out vec4 o;
void main(){
  float s = max(uSigma, 0.01);
  int r = int(ceil(s*3.0));
  vec4 acc = texture(uTex, vUv); float ws = 1.0;
  for (int i=1; i<=18; i++){
    if (i>r) break;
    float fi = float(i);
    float w = exp(-fi*fi/(2.0*s*s));
    acc += (texture(uTex, vUv+uDir*fi) + texture(uTex, vUv-uDir*fi))*w;
    ws += 2.0*w;
  }
  o = acc/ws;
}`;

const GL_COMP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uBase; uniform sampler2D uBlur;
uniform vec2 uSize; uniform int uN; uniform int uNS; uniform int uTint;
uniform vec4 uA[32]; uniform vec4 uB[32]; uniform int uBits[16];
float maskA(int i, vec2 px){
  vec4 A = uA[i]; vec4 B = uB[i];
  int type = int(B.z+0.5);
  float a = 1.0;
  if (type != 0){
    vec2 d = px - A.xy; float c = cos(B.x), s = sin(B.x);
    vec2 p = vec2(c*d.x + s*d.y, -s*d.x + c*d.y);
    vec2 h = max(A.zw, vec2(1.0));
    float f = clamp(B.y, 0.0, 1.0);
    if (type == 1){
      vec2 q = abs(p) - h;
      float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
      float fp = max(f*min(h.x, h.y), 0.75);
      a = 1.0 - smoothstep(-fp, 0.0, sd);
    } else if (type == 2){
      float r = length(p/h);
      float fr = max(f, 0.75/min(h.x, h.y));
      a = 1.0 - smoothstep(1.0-fr, 1.0, r);
    } else {
      a = 1.0 - smoothstep(-h.y, h.y, p.y);
    }
  }
  if (B.w > 0.5) a = 1.0 - a;
  return a;
}
void main(){
  vec2 px = vec2(vUv.x, 1.0-vUv.y)*uSize;
  float sa[16];
  for (int j=0; j<16; j++){ sa[j] = 0.0; if (j<uNS) sa[j] = maskA(16+j, px); }
  float keep = 1.0; float tint = 0.0;
  for (int i=0; i<16; i++){
    if (i>=uN) break;
    float a = maskA(i, px);
    int bits = uBits[i];
    for (int j=0; j<16; j++){
      if (j>=uNS) break;
      if (((bits >> j) & 1) == 1) a *= (1.0 - sa[j]);
    }
    keep *= (1.0-a);
    if (i==uTint) tint = a;
  }
  if (uTint == -2) tint = 1.0 - keep;
  vec4 base = texture(uBase, vUv);
  vec4 bl = texture(uBlur, vUv);
  vec3 col = mix(base.rgb, bl.rgb, 1.0-keep);
  col = mix(col, vec3(0.93, 0.22, 0.17), tint*0.45);
  o = vec4(col, 1.0);
}`;

class BlurRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true, depth: false, stencil: false });
    if (!gl) throw new Error('この端末では WebGL2 が使えません。');
    this.gl = gl;
    this.p = {
      copy: this._prog(GL_COPY), orient: this._prog(GL_ORIENT), gauss: this._prog(GL_GAUSS), comp: this._prog(GL_COMP),
    };
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.raw = this._tex();
    this.targets = {};
    this.w = canvas.width; this.h = canvas.height;
  }
  _prog(fs) {
    const gl = this.gl;
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, GL_VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const name = info.name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }
  _tex() {
    const gl = this.gl; const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  }
  _target(name, w, h) {
    const gl = this.gl;
    let t = this.targets[name];
    if (t && t.w === w && t.h === h) return t;
    if (!t) { t = { tex: this._tex(), fb: gl.createFramebuffer() }; this.targets[name] = t; }
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
    t.w = w; t.h = h;
    return t;
  }
  _draw(prog, target, texs, setU) {
    const gl = this.gl;
    gl.useProgram(prog.p);
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.w, this.h); }
    texs.forEach(([name, tex], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(prog.u[name], i); });
    if (setU) setU(prog.u);
    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  setSize(w, h) {
    if (this.canvas.width !== w) this.canvas.width = w;
    if (this.canvas.height !== h) this.canvas.height = h;
    this.w = w; this.h = h;
  }
  // src: canvas / VideoFrame / image。rotation は時計回り度数。srcW/H は src の画素サイズ
  // masks: 加算マスク（subBits で除算マスクを参照）、subs: 除算マスク（最大16）
  render({ source, srcW, srcH, rotation = 0, masks, subs = [], tint = -1 }) {
    const gl = this.gl, W = this.w, H = this.h;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.bindTexture(gl.TEXTURE_2D, this.raw);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    const oW = rotation % 180 ? srcH : srcW, oH = rotation % 180 ? srcW : srcH;

      if (down) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }

      src = t.tex;
    }
    if (!masks.length) { this._draw(this.p.copy, null, [['uTex', src]]); return; }

    // ぼかし強度ごとにまとめて合成
    const groups = new Map();
    masks.forEach((m, i) => {
      const k = Math.round(m.blur);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push({ m, i });
    });
    const list = [];
    for (const [k, arr] of groups) for (let j = 0; j < arr.length; j += 16) list.push({ blur: k, items: arr.slice(j, j + 16) });
    this._chain = [{ tex: src, w: W, h: H }];
    let base = src;
    list.forEach((g, gi) => {
      const sigma = Math.max(0.6, g.blur / 100 * 0.08 * Math.min(W, H));
      const blurTex = this._blur(sigma);
      const last = gi === list.length - 1;
      const out = last ? null : this._target(gi % 2 ? 'pB' : 'pA', W, H);
      const A = new Float32Array(128), B = new Float32Array(128), bits = new Int32Array(16);
      const put = (m, j) => {
        A.set([m.cx * W, m.cy * H, m.hw * W, m.hh * H], j * 4);
        B.set([m.rot, m.feather / 100, m.typeId, m.invert ? 1 : 0], j * 4);
      };
      let tintLocal = tint === -2 ? -2 : -1;
      g.items.forEach(({ m, i }, j) => { put(m, j); bits[j] = m.subBits | 0; if (i === tint) tintLocal = j; });
      const ns = Math.min(16, subs.length);
      for (let j = 0; j < ns; j++) put(subs[j], 16 + j);
      this._draw(this.p.comp, out, [['uBase', base], ['uBlur', blurTex]], u => {
        gl.uniform2f(u.uSize, W, H); gl.uniform1i(u.uN, g.items.length); gl.uniform1i(u.uNS, ns); gl.uniform1i(u.uTint, tintLocal);
        gl.uniform4fv(u.uA, A); gl.uniform4fv(u.uB, B); gl.uniform1iv(u.uBits, bits);
      });
      if (out) base = out.tex;
    });
  }
  _blur(sigma) {
    const gl = this.gl;
    let k = 0;
    while (sigma / (1 << k) > 5 && k < 8) k++;
    const chain = this._chain;
    for (let j = chain.length; j <= k; j++) {
      const prev = chain[j - 1];
      const w = Math.max(4, Math.ceil(prev.w / 2)), h = Math.max(4, Math.ceil(prev.h / 2));
      const t = this._target('L' + j, w, h);
      gl.bindTexture(gl.TEXTURE_2D, prev.tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      this._draw(this.p.copy, t, [['uTex', prev.tex]]);
      chain.push({ tex: t.tex, w, h });
    }
    const lv = chain[k];
    const s = sigma / (1 << k);
    const th = this._target('GH' + k, lv.w, lv.h), tv = this._target('GV' + k, lv.w, lv.h);
    this._draw(this.p.gauss, th, [['uTex', lv.tex]], u => { gl.uniform2f(u.uDir, 1 / lv.w, 0); gl.uniform1f(u.uSigma, s); });
    this._draw(this.p.gauss, tv, [['uTex', th.tex]], u => { gl.uniform2f(u.uDir, 0, 1 / lv.h); gl.uniform1f(u.uSigma, s); });
    return tv.tex;
  }
}

// ---------- マスク計算 ----------
const selMask = () => S.masks.find(m => m.id === S.sel) || null;
function interp(m, t) {
  const k = m.keys;
  if (!m.animated || k.length === 1 || t <= k[0].t) return { ...k[0] };
  const L = k[k.length - 1];
  if (t >= L.t) return { ...L };
  let i = 0; while (k[i + 1].t < t) i++;
  const a = k[i], b = k[i + 1], f = (t - a.t) / (b.t - a.t || 1);
  const r = { t };
  for (const p of ['cx', 'cy', 'hw', 'hh', 'rot']) r[p] = a[p] + (b[p] - a[p]) * f;
  return r;
}
const inSpan = (m, t) => t >= m.start - 1e-4 && t <= m.end + 1e-4;
function evalMask(m, t) {
  const g = interp(m, t);
  return { ...g, type: m.type, typeId: TYPE_ID[m.type], blur: m.blur, feather: m.feather, invert: m.invert, id: m.id };
}
const isSub = m => m.op === 'sub';
// 加算マスクの直後に、そのマスクを削る除算マスクを並べる
function orderedMasks() {
  const out = [], used = new Set();
  for (const m of S.masks) if (!isSub(m)) {
    out.push(m); used.add(m.id);
    for (const s of S.masks) if (isSub(s) && s.target === m.id) { out.push(s); used.add(s.id); }
  }
  for (const m of S.masks) if (!used.has(m.id)) out.push(m);
  return out;
}
// 時刻 t で効いているマスク。adds[i].subBits は subs のどれで削るかのビット列
function activeSet(list, t) {
  const subM = list.filter(m => m.visible && isSub(m) && inSpan(m, t)).slice(0, 16);
  const subs = subM.map(m => evalMask(m, t));
  const addM = list.filter(m => m.visible && !isSub(m) && inSpan(m, t));
  const adds = addM.map(m => {
    const e = evalMask(m, t); let bits = 0;
    subM.forEach((s, j) => { if (s.target === 'all' || s.target === m.id) bits |= 1 << j; });
    e.subBits = bits; return e;
  });
  return { adds, subs };
}
function frameTol() { return 0.5 / S.fps; }
function keyAt(m, t) { return m.keys.find(k => Math.abs(k.t - t) < frameTol()) || null; }
function keyForEdit(m) {
  if (!m.animated) return m.keys[0];
  let k = keyAt(m, S.t);
  if (!k) {
    const g = interp(m, S.t);
    k = { t: S.t, cx: g.cx, cy: g.cy, hw: g.hw, hh: g.hh, rot: g.rot };
    m.keys.push(k); m.keys.sort((a, b) => a.t - b.t);
  }
  return k;
}

  const pushAudio = until => {
    if (!a) return;
    while (ai < a.n && aPts(ai) <= until) { mux.addAudio(file.slice(a.offsets[ai], a.offsets[ai] + a.sizes[ai]), a.sizes[ai], a.durs[ai]); ai++; }
  };
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (!avcC && meta && meta.decoderConfig && meta.decoderConfig.description) {
        const d = meta.decoderConfig.description;
        avcC = d instanceof ArrayBuffer ? new Uint8Array(d.slice(0)) : new Uint8Array(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength));
      }
      const buf = new Uint8Array(chunk.byteLength); chunk.copyTo(buf);
      pushAudio(chunk.timestamp / 1e6 + 0.25);
      mux.addVideo(buf, chunk.timestamp, chunk.type === 'key');
      encoded++;
    },
    error: e => { encErr = e; },
  });
  encoder.configure(encCfg);
  const total = v.n;
  let lastDur = 1e6 / fps;
  const decoder = new VideoDecoder({
    output: frame => {
      try {
        if (encErr || signal.aborted) return;
        if (frame.timestamp < -1000) return; // 編集リストで隠れたフレーム
        const t = Math.max(0, frame.timestamp / 1e6);
        const ms = masksAt(t);
        R.render({ source: frame, srcW: frame.displayWidth, srcH: frame.displayHeight, rotation: v.rotation, masks: ms.adds, subs: ms.subs });
        const vf = new VideoFrame(canvas, { timestamp: Math.max(0, frame.timestamp), duration: frame.duration || undefined, alpha: 'discard' });
        if (frame.duration) lastDur = frame.duration;
        encoder.encode(vf, { keyFrame: frameNo % gop === 0 });
        vf.close(); frameNo++;
      } catch (e) { encErr = e; }
      finally { frame.close(); }
    },
    error: e => { decErr = e; },
  });
  decoder.configure(decCfg(v));
  const reader = new BlockReader(file);
  try {
    for (let i = 0; i < v.n; i++) {
      if (signal.aborted) throw new Error('中止');
      if (encErr) throw encErr;
      if (decErr) throw decErr;
      while (decoder.decodeQueueSize > 3 || encoder.encodeQueueSize > 4) {
        await sleep(3);
        if (signal.aborted) throw new Error('中止');
        if (encErr) throw encErr; if (decErr) throw decErr;
      }
      decoder.decode(chunkFor(v, i, await reader.read(v.offsets[i], v.sizes[i])));
      if (i % 5 === 0) onProgress(Math.min(frameNo, total), total);
    }
    await decoder.flush();
    await encoder.flush();
    if (encErr) throw encErr; if (decErr) throw decErr;
    onProgress(total, total);
    pushAudio(Infinity);
    if (!avcC) throw new Error('エンコーダーから設定情報を取得できませんでした');
    return mux.finalize(
      { width: w, height: h, avcC, timescale: v.timescale >= 1000 ? v.timescale : 90000, lastDurUs: lastDur },
      a ? { timescale: a.timescale, entryBytes: a.entryBytes, mediaTime: a.mediaTime } : null

  } finally {
    try { decoder.close(); } catch (e) { }
    try { encoder.close(); } catch (e) { }
    try { R.gl.getExtension('WEBGL_lose_context')?.loseContext(); } catch (e) { }
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.exporting) toast('書き出し中は画面を切り替えないでください。遅くなったり止まったりします。', 5000);
});

// ---------- タイムライン（再生ヘッド中央固定・ピンチでズーム） ----------
const tlc = $('#tlc'), tctx = tlc.getContext('2d');
const TL = { w: 0, h: 0, pps: 60, viewT: 0, free: false, rulerH: 22, filmH: 42, rowH: 28, gap: 6, maxRows: 4, rowOff: 0 };
let COL = {};
function readCols() {
  COL = { ink: cssVar('--ink'), muted: cssVar('--muted'), line: cssVar('--line'), raise: cssVar('--raise'), panel: cssVar('--panel'),
    accent: cssVar('--accent'), accentInk: cssVar('--accent-ink'), soft: cssVar('--accent-soft'), sub: cssVar('--sub'), bg: cssVar('--bg') };
}
readCols();
const minPps = () => Math.max(0.5, (TL.w * 0.8) / Math.max(0.1, S.duration));
const maxPps = () => S.fps * 90;
const xOf = t => TL.w / 2 + (t - TL.viewT) * TL.pps;
const tOf = x => TL.viewT + (x - TL.w / 2) / TL.pps;
const lastFrameT = () => FP.length ? FP[FP.length - 1] : 0;
function snapT(t) {
  if (!FP.length) return t;
  let i = frameIndex(t);
  if (i + 1 < FP.length && Math.abs(FP[i + 1] - t) < Math.abs(FP[i] - t)) i++;
  return Math.max(0, FP[i]);
}
function tlLayout() {
  const dpr = window.devicePixelRatio || 1;
  const n = S.media ? Math.max(1, S.masks.length) : 1;
  const rows = Math.min(TL.maxRows, n);
  const h = TL.rulerH + TL.filmH + TL.gap + rows * TL.rowH + 4;
  const w = tlc.parentElement.clientWidth;
  if (TL.w !== w || TL.h !== h) {
    TL.w = w; TL.h = h;
    tlc.style.height = h + 'px';
    tlc.width = Math.round(w * dpr); tlc.height = Math.round(h * dpr);
  }
  if (S.media) TL.pps = clamp(TL.pps, minPps(), maxPps());
  drawTL();
}
new ResizeObserver(() => tlLayout()).observe($('#tlwrap'));

function rowLayout() {
  const list = orderedMasks();
  const rows = Math.min(TL.maxRows, list.length);
  const si = list.findIndex(m => m.id === S.sel);
  if (si >= 0) {
    if (si < TL.rowOff) TL.rowOff = si;
    if (si >= TL.rowOff + rows) TL.rowOff = si - rows + 1;
  }
  TL.rowOff = clamp(TL.rowOff, 0, Math.max(0, list.length - rows));
  return { list, rows, y0: TL.rulerH + TL.filmH + TL.gap };
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

let tlQueued = false;
function scheduleTL() { if (tlQueued) return; tlQueued = true; requestAnimationFrame(() => { tlQueued = false; drawTL(); }); }
function drawTL() {
  if (!TL.w) return;
  const dpr = window.devicePixelRatio || 1, c = tctx, W = TL.w, H = TL.h;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  if (!S.media) return;
  const x0 = xOf(0), x1 = xOf(S.duration);
  // 目盛り
  const fps = S.fps;
  const steps = [1 / fps, 2 / fps, 5 / fps, 10 / fps, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600];
  const major = steps.find(s => s * TL.pps >= 64) || 3600;
  const minor = [...steps].reverse().find(s => s < major && s * TL.pps >= 9 && Math.abs(major / s - Math.round(major / s)) < 1e-6);
  c.font = '500 10px "Zen Kaku Gothic New", system-ui, sans-serif';
  c.textBaseline = 'top';
  const tA = Math.max(0, tOf(0)), tB = Math.min(S.duration, tOf(W));
  const drawTicks = (step, len, label) => {
    let k = Math.floor(tA / step);
    for (let guard = 0; guard < 400; guard++, k++) {
      const t = k * step; if (t > tB + step) break;
      if (t < 0 || t > S.duration + 1e-6) continue;
      const x = xOf(t);
      c.fillStyle = COL.muted; c.fillRect(Math.round(x), TL.rulerH - len, 1, len);
      if (label) {
        let txt;
        if (step < 1) { const sec = Math.floor(t + 1e-6), fr = Math.round((t - sec) * fps); txt = fr === 0 ? fmtS(sec) : fr + 'f'; }
        else txt = fmtS(t);
        c.fillStyle = COL.muted; c.fillText(txt, x + 3, 3);
      }
    }
  };
  if (minor) drawTicks(minor, 4, false);
  drawTicks(major, 9, true);
  // フィルムストリップ
  const fy = TL.rulerH, fh = TL.filmH;
  c.save();
  rr(c, x0, fy, x1 - x0, fh, 6); c.clip();
  c.fillStyle = COL.raise; c.fillRect(x0, fy, x1 - x0, fh);
  const tw = Math.max(16, fh * S.W / S.H);
  const kS = Math.max(0, Math.floor((0 - x0) / tw)), kE = Math.ceil((W - x0) / tw);
  for (let k = kS; k <= kE; k++) {
    const x = x0 + k * tw; if (x > x1) break;
    const th = nearestThumb((k + 0.5) * tw / TL.pps);
    if (th) c.drawImage(th.c, x, fy, tw, fh);
  }
  c.restore();
  c.strokeStyle = COL.line; c.lineWidth = 1; rr(c, x0 + .5, fy + .5, x1 - x0 - 1, fh - 1, 6); c.stroke();
  // マスクの行
  const { list, rows, y0 } = rowLayout();
  if (!list.length) {
    c.fillStyle = COL.muted; c.font = '12px "Zen Kaku Gothic New", system-ui, sans-serif'; c.textBaseline = 'middle';
    c.fillText('マスクを追加すると、ここに表示区間が並びます', 14, y0 + TL.rowH / 2);
  }
  TL.hits = [];
  for (let r = 0; r < rows; r++) {
    const m = list[TL.rowOff + r]; const y = y0 + r * TL.rowH;
    const sel = m.id === S.sel, sub = isSub(m);
    const bx0 = xOf(m.start), bx1 = xOf(m.end);
    const vx0 = Math.max(bx0, -20), vx1 = Math.min(bx1, W + 20);
    TL.hits.push({ m, y, bx0, bx1 });
    if (vx1 <= vx0) continue;
    c.globalAlpha = m.visible ? 1 : 0.4;
    rr(c, vx0, y + 3, vx1 - vx0, TL.rowH - 6, 6);
    if (sub) { c.fillStyle = sel ? COL.sub : COL.raise; c.fill(); c.strokeStyle = COL.sub; c.lineWidth = 1.2; c.setLineDash(sel ? [] : [4, 3]); c.stroke(); c.setLineDash([]); }
    else { c.fillStyle = sel ? COL.accent : COL.soft; c.fill(); }
    // 名前（左端に張り付く）
    c.save(); rr(c, vx0, y + 3, vx1 - vx0, TL.rowH - 6, 6); c.clip();
    c.fillStyle = sel ? (sub ? '#0d2036' : COL.accentInk) : COL.ink;
    c.font = (sel ? '700 ' : '500 ') + '11px "Zen Kaku Gothic New", system-ui, sans-serif'; c.textBaseline = 'middle';
    c.fillText((sub ? '− ' : '') + m.name, Math.max(vx0 + 10, 6) + (sel ? 6 : 0), y + TL.rowH / 2);
    // キーフレーム
    if (m.animated) for (const k of m.keys) {
      const kx = xOf(k.t); if (kx < -8 || kx > W + 8) continue;
      const s = sel ? 5 : 4, cy = y + TL.rowH / 2;
      c.beginPath(); c.moveTo(kx, cy - s); c.lineTo(kx + s, cy); c.lineTo(kx, cy + s); c.lineTo(kx - s, cy); c.closePath();
      c.fillStyle = sel ? '#fff' : (sub ? COL.sub : COL.accent); c.fill();
      c.strokeStyle = sel ? 'rgba(0,0,0,.35)' : COL.raise; c.lineWidth = 1; c.stroke();
    }
    c.restore();
    // 選択中はトリムハンドル
    if (sel) {
      c.fillStyle = COL.ink;
      for (const hx of [bx0, bx1]) if (hx > -10 && hx < W + 10) { rr(c, hx - 4, y + 1, 8, TL.rowH - 2, 3); c.fill(); c.fillStyle = COL.raise; c.fillRect(hx - 0.75, y + 9, 1.5, TL.rowH - 18); c.fillStyle = COL.ink; }
    }
    c.globalAlpha = 1;
  }
  if (list.length > rows) {
    c.fillStyle = COL.muted; c.font = '10px system-ui, sans-serif'; c.textBaseline = 'bottom';
    c.fillText(`${TL.rowOff + 1}–${TL.rowOff + rows} / ${list.length}`, 6, H - 1);
  }
  // 再生ヘッド
  const px = Math.round(W / 2);
  c.fillStyle = COL.ink; c.fillRect(px - 1, 0, 2, H);
  c.beginPath(); c.moveTo(px - 6, 0); c.lineTo(px + 6, 0); c.lineTo(px, 8); c.closePath(); c.fill();
}
function fmtS(t) { const m = Math.floor(t / 60), s = Math.floor(t - m * 60 + 1e-6); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }

// サムネイル（キーフレームだけをデコード）
let thumbs = [], thumbGen = 0;
function nearestThumb(t) {
  if (!thumbs.length) return null;
  let lo = 0, hi = thumbs.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (thumbs[mid].t <= t) lo = mid; else hi = mid - 1; }
  const a = thumbs[lo], b = thumbs[lo + 1];
  return b && Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a;
}
async function buildThumbs() {
  const gen = ++thumbGen; thumbs = [];
  const v = S.media.video, file = S.file;
  if (!('VideoDecoder' in window)) return;
  try { const r = await VideoDecoder.isConfigSupported(decCfg(v)); if (!r.supported) return; } catch (e) { return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const th = Math.round(TL.filmH * dpr), tw = Math.max(8, Math.round(th * S.W / S.H));
  // 間隔がほぼ均等になるように同期サンプルを選ぶ（最大 180 枚）
  const target = clamp(Math.ceil(S.duration / 1.5), 8, 180);
  const picks = []; let lastT = -Infinity; const minGap = S.duration / target * 0.8;
  for (const i of v.syncList) { const t = v.pts[i]; if (t - lastT >= minGap) { picks.push(i); lastT = t; } }
  const reader = new BlockReader(file, 1 << 20);
  const pending = [];
  const dec = new VideoDecoder({
    output: f => {
      try {
        if (gen !== thumbGen) return;
        const c = document.createElement('canvas'); c.width = tw; c.height = th;
        const x = c.getContext('2d');
        const rot = v.rotation;
        x.translate(tw / 2, th / 2); x.rotate(rot * Math.PI / 180);
        const dw = rot % 180 ? th : tw, dh = rot % 180 ? tw : th;
        x.drawImage(f, -dw / 2, -dh / 2, dw, dh);
        pending.push({ t: f.timestamp / 1e6, c });
        if (pending.length >= 6) flush();
      } finally { f.close(); }
    },
    error: () => { },
  });
  const flush = () => { if (!pending.length) return; thumbs = thumbs.concat(pending.splice(0)).sort((a, b) => a.t - b.t); scheduleTL(); };
  try {
    dec.configure(decCfg(v));
    for (const i of picks) {
      if (gen !== thumbGen) break;
      while (dec.decodeQueueSize > 2) await sleep(8);
      const data = await reader.read(v.offsets[i], v.sizes[i]);
      dec.decode(new EncodedVideoChunk({ type: 'key', timestamp: Math.round(v.pts[i] * 1e6), data }));
      if (S.exporting) await sleep(50);
    }
    await dec.flush();
  } catch (e) { /* サムネイルなしで続行 */ }
  try { dec.close(); } catch (e) { }
  if (gen === thumbGen) flush();
}

// 操作：ドラッグでスクロール、慣性、ピンチ/ボタンでズーム、区間の端でトリム
const tptr = new Map();
let tg = null, inertia = 0;
function stopInertia() { if (inertia) cancelAnimationFrame(inertia); inertia = 0; TL.free = false; }
function tlPt(e) { const r = tlc.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function scrollTo(t) { TL.viewT = clamp(t, 0, lastFrameT()); TL.free = true; const st = snapT(TL.viewT); if (st !== S.t) seek(st); else drawTL(); }
tlc.addEventListener('pointerdown', e => {
  if (!S.media || S.exporting) return;
  stopInertia(); pause();
  tlc.setPointerCapture(e.pointerId);
  const p = tlPt(e); tptr.set(e.pointerId, p);
  if (tptr.size === 2) {
    const [a, b] = [...tptr.values()];
    if (tg && tg.op === 'trim') commit();
    tg = { op: 'zoom', d0: Math.abs(a.x - b.x) || 1, pps0: TL.pps };
    return;
  }
  if (tptr.size > 2) return;
  TL.viewT = S.t;
  tg = { op: 'scroll', x0: p.x, y0: p.y, t0: S.t, moved: false, samples: [{ x: p.x, time: performance.now() }] };
  const hit = (TL.hits || []).find(h => p.y >= h.y && p.y < h.y + TL.rowH);
  if (hit) {
    const m = hit.m;
    if (m.id === S.sel) {
      if (Math.abs(p.x - hit.bx0) < 16) { tg = { op: 'trim', side: 's', m, moved: false }; return; }
      if (Math.abs(p.x - hit.bx1) < 16) { tg = { op: 'trim', side: 'e', m, moved: false }; return; }
    }
    if (m.animated) {
      const k = m.keys.find(k => Math.abs(xOf(k.t) - p.x) < 11);
      if (k) tg.keyTap = k;
    }
    if (p.x >= hit.bx0 - 4 && p.x <= hit.bx1 + 4) tg.maskTap = m;
  }
});
tlc.addEventListener('pointermove', e => {
  if (!tptr.has(e.pointerId) || !tg) return;
  const p = tlPt(e); tptr.set(e.pointerId, p);
  if (tg.op === 'zoom') {
    if (tptr.size < 2) return;
    const [a, b] = [...tptr.values()];
    TL.pps = clamp(tg.pps0 * (Math.abs(a.x - b.x) || 1) / tg.d0, minPps(), maxPps());
    drawTL(); return;
  }
  if (tg.op === 'trim') {
    const m = tg.m, t = snapT(tOf(p.x));
    tg.moved = true;
    if (tg.side === 's') m.start = clamp(t, 0, Math.max(0, m.end - 1 / S.fps));
    else m.end = clamp(t + 0.5 / S.fps, m.start + 1 / S.fps, S.duration);
    if (m.end >= lastFrameT()) m.end = Math.max(m.end, S.duration);
    $('#spanS').textContent = fmt(selMask()?.start); $('#spanE').textContent = fmt(selMask()?.end);
    drawTL(); scheduleDraw(); return;
  }
  if (!tg.moved && Math.abs(p.x - tg.x0) < 5) return;
  tg.moved = true;
  tg.samples.push({ x: p.x, time: performance.now() }); if (tg.samples.length > 6) tg.samples.shift();
  scrollTo(tg.t0 - (p.x - tg.x0) / TL.pps);
});
const tlEnd = e => {
  if (!tptr.has(e.pointerId)) return;
  tptr.delete(e.pointerId);
  if (!tg) return;
  if (tg.op === 'zoom') { if (!tptr.size) tg = null; return; }
  if (tg.op === 'trim') { tg = null; commit(); refreshAll(); return; }
  if (!tg.moved) {
    if (tg.keyTap) { const t = tg.keyTap.t; if (tg.maskTap && tg.maskTap.id !== S.sel) select(tg.maskTap.id); seek(t); }
    else if (tg.maskTap) select(tg.maskTap.id);
    TL.free = false; tg = null; updTime(); return;
  }
  // 慣性スクロール
  const sm = tg.samples, a = sm[0], b = sm[sm.length - 1];
  let v = (b.time - a.time) > 0 && performance.now() - b.time < 80 ? (b.x - a.x) / (b.time - a.time) : 0; // px/ms
  tg = null;
  if (Math.abs(v) < 0.15) { TL.free = false; updTime(); return; }
  let last = performance.now();
  const step = now => {
    const dt = Math.min(40, now - last); last = now;
    v *= Math.pow(0.93, dt / 16);
    const nt = TL.viewT - v * dt / TL.pps;
    if (Math.abs(v) < 0.02 || nt <= 0 || nt >= lastFrameT()) { scrollTo(nt); stopInertia(); updTime(); return; }
    scrollTo(nt);
    inertia = requestAnimationFrame(step);
  };
  inertia = requestAnimationFrame(step);
};
tlc.addEventListener('pointerup', tlEnd);
tlc.addEventListener('pointercancel', tlEnd);
tlc.addEventListener('wheel', e => {
  if (!S.media) return;
  e.preventDefault(); stopInertia(); pause();
  if (e.ctrlKey || e.metaKey) { TL.pps = clamp(TL.pps * Math.exp(-e.deltaY * 0.01), minPps(), maxPps()); drawTL(); return; }
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  TL.viewT = S.t; scrollTo(S.t + d / TL.pps); TL.free = false;
}, { passive: false });
const zoomBy = k => { if (!S.media) return; TL.pps = clamp(TL.pps * k, minPps(), maxPps()); drawTL(); };
$('#zIn').onclick = () => zoomBy(1.8);
$('#zOut').onclick = () => zoomBy(1 / 1.8);

// ---------- 初期化 ----------
if (matchMedia) { const upd = () => { ACCENT = cssVar('--accent') || ACCENT; SUBC = cssVar('--sub') || SUBC; readCols(); scheduleDraw(); }; upd(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', upd); }
renderMaskList(); renderProps(); layout(); syncKeyBtn();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
